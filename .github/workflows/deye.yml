name: Deye fetch

# Дані інверторів раз на 5 хв (о :00, :05 ... UTC) -> сайт.
#
# Розклад GitHub запізнюється на 5-20 хв, тому точність дає не cron, а цикл усередині: один запуск
# працює ~5 г 50 хв (ліміт задачі — 6 г) і в кінці сам запускає наступний (workflow_dispatch).
# Щогодинний cron — сторож: якщо ланцюжок обірвався, підхопить протягом години.
# concurrency: одночасно працює один запуск, ще один чекає в черзі — дублів запитів до Deye немає.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: deye-fetch
  cancel-in-progress: false

permissions:
  actions: write    # запустити наступний запуск
  contents: write   # раз на місяць порожній коміт — інакше GitHub вимикає розклад у публічному репо через 60 днів

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5

      - name: Fetch loop
        env:
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          DEYE_DEVICES: ${{ secrets.DEYE_DEVICES }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node fetch.mjs --minutes 350

      - name: Keep repo active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deye.yml --ref ${{ github.ref_name }} --repo ${{ github.repository }}
